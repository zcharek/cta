name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npx tsc
      - name: Tests Vitest (règles métier, accès, import ; Postgres en mémoire)
        run: npm test
      - name: Build
        run: npm run build
      - name: Navigateur pour Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout (serveur de démonstration)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
