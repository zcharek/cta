    <!-- GitHub Pages SPA redirect script -->
    <script type="text/javascript">
        // Handle SPA routing for GitHub Pages
        (function() {
            var urlParams = new URLSearchParams(window.location.search);
            var path = urlParams.get('path');
            var redirect = urlParams.get('redirect');
            
            console.log('Index.html - Current URL:', window.location.href);
            console.log('Index.html - Path param:', path);
            console.log('Index.html - Redirect param:', redirect);
            console.log('Index.html - Current pathname:', window.location.pathname);
            
            // If we have a path parameter, use it
            if (path) {
                console.log('Redirecting to path:', path);
                window.history.replaceState(null, null, path);
            } else if (redirect) {
                console.log('Redirecting to redirect:', redirect);
                window.history.replaceState(null, null, redirect);
            }
        })();
        
        // GitHub Pages SPA redirect (legacy)
        (function(l) {
            if (l.search[1] === '/' ) {
                var decoded = l.search.slice(1).split('&').map(function(s) { 
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
